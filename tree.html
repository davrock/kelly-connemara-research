<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kelly — A Connemara Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a232b; --ink-soft:#41505c; --parch:#eef2f5; --parch-2:#e2e9ef;
    --line:#c4d0da; --oxblood:#1f4778; --gold:#b78a2e; --leaf:#4f5a63;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);background:var(--parch);
    background-image:radial-gradient(circle at 20% 8%,rgba(255,255,255,.6),transparent 40%),
      radial-gradient(circle at 85% 80%,rgba(31,71,120,.06),transparent 45%);
    font-family:'EB Garamond',Georgia,serif;font-size:18px;line-height:1.5}

  #gate{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:var(--parch)}
  .lock{max-width:30rem;width:90%;text-align:center;padding:2.5rem 2rem}
  .lock .crest-svg{width:88px;height:auto;margin-bottom:.4rem}
  .lock h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.7rem;margin:.2rem 0 .1rem;letter-spacing:.02em;color:var(--oxblood)}
  .lock p{color:var(--ink-soft);margin:.2rem 0 1.4rem;font-style:italic}
  .lock form{display:flex;gap:.5rem;justify-content:center}
  .lock input{flex:1;max-width:18rem;padding:.7rem .9rem;font-family:inherit;font-size:1rem;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:2px}
  .lock input:focus{outline:none;border-color:var(--oxblood);box-shadow:0 0 0 2px rgba(31,71,120,.15)}
  .lock button{padding:.7rem 1.2rem;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1rem;letter-spacing:.04em;background:var(--oxblood);color:#eef2f5;border:none;border-radius:2px;cursor:pointer}
  .lock button:hover{background:#12325a}
  .lock .err{color:var(--oxblood);min-height:1.2em;font-size:.92rem;margin-top:.9rem}
  .lock .rule{width:3rem;height:1px;background:var(--gold);margin:1.4rem auto 0;opacity:.7}

  #content{position:relative;z-index:1;max-width:62rem;margin:0 auto;padding:3rem 1.5rem 5rem;display:none}
  .masthead{text-align:center;margin-bottom:2.2rem}
  .masthead .crest-svg{width:120px;height:auto;margin:0 auto .6rem;display:block}
  .kicker{text-transform:uppercase;letter-spacing:.28em;font-size:.7rem;color:var(--gold);margin:0 0 .8rem}
  .masthead h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:3.4rem;line-height:1;margin:0 0 .6rem;color:var(--oxblood)}
  .masthead .sub{font-style:italic;color:var(--ink-soft);margin:.2rem 0 1rem;font-size:1.05rem}
  .masthead .stats{font-variant:small-caps;letter-spacing:.06em;color:var(--leaf);font-size:.95rem}
  .legend{font-size:.82rem;color:var(--ink-soft);margin-top:1rem}
  .swatch{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;vertical-align:-1px;margin-right:.15rem}
  .swatch.spine{background:var(--oxblood)} .swatch.coll{background:var(--line)}
  .ver{color:var(--gold);font-size:.8em;vertical-align:.15em;margin-left:.2em}
  .hint{font-size:.8rem;color:var(--leaf);margin-top:.9rem}
  .hint button{font-family:inherit;font-size:.78rem;background:none;border:1px solid var(--line);color:var(--ink-soft);border-radius:2px;padding:.18rem .5rem;cursor:pointer;margin-left:.2rem}
  .hint button:hover{border-color:var(--oxblood);color:var(--oxblood)}

  .branch{margin-top:2.6rem;padding-top:1.4rem;border-top:1px solid var(--line)}
  .branch-title{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.5rem;
    color:var(--oxblood);margin:0 0 1rem;letter-spacing:.01em}
  .branch-title::before{content:"\2767";color:var(--gold);font-size:.9em;margin-right:.5rem;vertical-align:.05em}
  .island .branch-title{margin-bottom:.35rem}
  .island-note{font-style:italic;color:var(--ink-soft);font-size:.9rem;margin:0 0 1rem}
  .tree ul{list-style:none;margin:0;padding-left:1.6rem;position:relative}
  .tree ul.root{padding-left:0}
  .tree li{position:relative;padding:.28rem 0 .28rem 1.1rem}
  .tree ul:not(.root)>li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1px solid var(--line)}
  .tree ul:not(.root)>li::after{content:"";position:absolute;left:0;top:1.15rem;width:.9rem;border-top:1px solid var(--line)}
  .tree ul:not(.root)>li:last-child::before{bottom:calc(100% - 1.15rem)}

  .card{display:inline-block;vertical-align:top;position:relative}
  .tw{position:absolute;left:-1.55rem;top:.15rem;width:1.1rem;height:1.1rem;line-height:1.05rem;
    text-align:center;color:var(--oxblood);cursor:pointer;font-size:.7rem;border:1px solid var(--line);
    border-radius:2px;background:var(--parch-2);user-select:none}
  .tw::before{content:"\25be"}
  li.collapsed>.card>.tw::before{content:"\25b8"}
  li.collapsed>ul{display:none}
  .tw:hover{border-color:var(--oxblood)}

  .nm{font-weight:600;font-size:1.08rem}
  .d{color:var(--ink-soft);margin-left:.45rem;font-size:.92rem;white-space:nowrap}
  /* 2026-09-04 readability pass: one fact per line inside a card */
  .card{display:block;padding:.15rem .5rem .25rem .3rem;border-radius:3px;max-width:44rem}
  .card .sp,.card .pl,.card .oc,.card .hold{display:block;margin-left:0}
  .card .sp{color:var(--ink);font-size:.95rem;margin-top:.05rem}
  .card .pl{font-style:italic;color:var(--leaf);font-size:.84rem}
  .card .oc{font-variant:small-caps;letter-spacing:.05em;font-size:.76rem;color:var(--leaf)}
  .card .hold{font-size:.8rem;color:var(--gold)}
  .tree{counter-reset:gen}
  li.spine>.card{background:rgba(31,71,120,.07);border-left:3px solid var(--oxblood);counter-increment:gen}
  li.spine>.card>.nm::before{content:counter(gen,upper-roman) "2";color:var(--oxblood);font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:.04em}
  li.leaf>.card{opacity:.85}
  li.leaf>.card>.emig{display:inline-block;margin-left:.45rem;font-size:.8rem;color:var(--gold);font-style:italic}
  .leafmark{color:var(--gold);font-style:italic}
  .tree li{padding:.34rem 0 .34rem 1.1rem}
  @media (max-width:600px){ .tree ul{padding-left:.9rem} .tree li{padding-left:.8rem} .tw{left:-1.3rem} .d{white-space:normal} body{font-size:16px} }
  .pl{display:block;color:var(--leaf);font-size:.82rem;font-style:italic;margin-top:-.1rem}
  .sp{display:block;font-size:.86rem;color:var(--ink-soft)}
  .sp .d{margin-left:.15rem}
  .oc{display:inline-block;font-size:.74rem;color:var(--leaf);font-variant:small-caps;letter-spacing:.05em;margin-right:.5rem}
  .hold{display:inline-block;font-size:.76rem;color:var(--gold);font-style:italic}
  .emig{display:inline-block;margin-left:.45rem;font-size:.8rem;color:var(--gold);font-style:italic}

  .node.spine>.card>.nm{color:var(--oxblood);font-weight:700}
  .node.spine>.card{border-left:2px solid var(--oxblood);padding-left:.55rem;margin-left:-.55rem}
  .node.spine>.card>.tw{left:-2.1rem}
  .leaf>.card>.nm{color:var(--leaf);font-weight:500}

  footer{text-align:center;margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--line);color:var(--leaf);font-style:italic;font-size:.85rem}
  .backlink{margin:0 0 1.4rem;font-size:.82rem;font-variant:small-caps;letter-spacing:.08em}
  footer a,.backlink a{color:var(--oxblood);text-decoration:none;border-bottom:1px solid var(--line)}
  footer a:hover,.backlink a:hover{border-color:var(--oxblood)}

  @media print{
    #gate{display:none!important} #content{display:block!important}
    .hint,.tw{display:none!important} li.collapsed>ul{display:block!important}
    body{background:#fff;font-size:11pt}
    .masthead h1,.nm{color:#000!important}
  }
  @media(max-width:640px){ body{font-size:16px} .masthead h1{font-size:2.4rem} }
</style>
</head>

  <div class="lock">

    <p>A private family record</p>
    <form id="f" autocomplete="off">

      <button type="submit">Enter</button>
    </form>
    <div class="err" id="err"></div>
    <div class="rule"></div>
  </div>
</div>
<div id="content"></div>

const b642buf = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pass){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b642buf(ENC.salt), iterations:ENC.iters, hash:"SHA-256"},
    baseKey, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b642buf(ENC.iv)}, key, b642buf(ENC.ct));
  return new TextDecoder().decode(pt);
}
function wireTree(){
  const content = document.getElementById("content");
  content.addEventListener("click", e => {
    const tw = e.target.closest(".tw");
    if(!tw) return;
    tw.closest("li").classList.toggle("collapsed");
  });
  content.addEventListener("keydown", e => {
    if((e.key==="Enter"||e.key===" ") && e.target.classList.contains("tw")){
      e.preventDefault(); e.target.closest("li").classList.toggle("collapsed");
    }
  });
  const ea = document.getElementById("expand-all"), ca = document.getElementById("collapse-all");
  if(ea) ea.onclick = () => content.querySelectorAll("li.collapsed").forEach(li=>li.classList.remove("collapsed"));
  if(ca) ca.onclick = () => content.querySelectorAll("li.has-kids").forEach(li=>{
    if(!li.classList.contains("spine")) li.classList.add("collapsed");
  });
}
const form = document.getElementById("f"), err = document.getElementById("err");
form.addEventListener("submit", async e => {
  e.preventDefault(); err.textContent = "";
  try{
    const htmlText = await decrypt(document.getElementById("pw").value);
    document.getElementById("content").innerHTML = htmlText;
    document.getElementById("gate").style.display = "none";
    document.getElementById("content").style.display = "block";
    document.title = "The Kelly Line";
    wireTree();
  }catch(_){
    err.textContent = "Incorrect passphrase.";
    document.getElementById("pw").select();
  }
});
